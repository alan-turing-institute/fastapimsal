[project]
name = "fastapimsal"
version = "0.12.0"
description = "Library to authenticate users using MSAL"
authors = [
  {"name" = "Oscar Giles", "email"=" ogiles@turing.ac.uk"},
]
dynamic = [ "dependencies" ]
requires-python = ">=3.11,<4"
dependencies = [
    "anyio>=4.9.0,<5.0.0",
    "async-lru>=2.4.0,<2.5.0",
    "fastapi>=0.139.0,<1.0.0",
    "itsdangerous>=2.2.0,<2.3.0",
    "msal>=1.37.0,<2.0.0",
    "pydantic>=2.9.2,<3.0.0",
    "pydantic-settings>=2.10.1,<3.0.0",
    "httpx2 (>=2.10.0,<3.0.0)",
    "pyjwt[crypto] (>=2.10.1,<3.0.0)",
]


[tool.poetry.group.dev.dependencies]
# Exact pins: with no lock file, Renovate bumps these in PRs so that new
# linter releases can't break CI unannounced.
black = "26.10.1"
flake8 = "7.5.0"
httpie-jwt-auth = "0.4.0"
httpie = "3.2.4"
isort = "9.0.2"
mypy = "2.4.1"
pre-commit = "4.7.0"
pytest = "9.2.0"
pylint = "4.1.4"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.isort]
profile = "black"
